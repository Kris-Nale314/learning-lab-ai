<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 600">
  <!-- Styles -->
  <defs>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A6491;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <rect x="50" y="20" width="800" height="50" rx="5" fill="url(#headerGradient)" filter="url(#shadow)" />
  <text x="450" y="52" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle" fill="white">Framework Assessment Workbench Workflow</text>

  <!-- User -->
  <circle cx="100" cy="120" r="30" fill="#3498DB" filter="url(#shadow)" />
  <text x="100" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="white">User</text>
  
  <!-- Input Phase -->
  <rect x="200" y="90" width="150" height="180" rx="5" fill="#5DADE2" filter="url(#shadow)" />
  <text x="275" y="115" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Input</text>
  
  <rect x="215" y="130" width="120" height="40" rx="5" fill="#ffffff" stroke="#2980B9" stroke-width="2" />
  <text x="275" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="#2980B9">Document</text>
  
  <rect x="215" y="180" width="120" height="40" rx="5" fill="#ffffff" stroke="#2980B9" stroke-width="2" />
  <text x="275" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="#2980B9">Framework</text>
  
  <rect x="215" y="230" width="120" height="30" rx="5" fill="#ffffff" stroke="#2980B9" stroke-width="2" />
  <text x="275" y="250" font-family="Arial" font-size="12" text-anchor="middle" fill="#2980B9">Options</text>
  
  <!-- Processing Phase -->
  <rect x="400" y="90" width="300" height="180" rx="5" fill="#16A085" filter="url(#shadow)" />
  <text x="550" y="115" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">AI Processing</text>
  
  <!-- Four stages of processing -->
  <rect x="415" y="130" width="270" height="130" rx="5" fill="#ffffff" stroke="#16A085" stroke-width="2" />
  
  <rect x="425" y="140" width="120" height="30" rx="5" fill="#E8F8F5" stroke="#16A085" stroke-width="1" />
  <text x="485" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#16A085">1. Strategy Design</text>
  
  <rect x="555" y="140" width="120" height="30" rx="5" fill="#E8F8F5" stroke="#16A085" stroke-width="1" />
  <text x="615" y="160" font-family="Arial" font-size="12" text-anchor="middle" fill="#16A085">2. Evidence Extraction</text>
  
  <rect x="425" y="180" width="120" height="30" rx="5" fill="#E8F8F5" stroke="#16A085" stroke-width="1" />
  <text x="485" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#16A085">3. Evaluation</text>
  
  <rect x="555" y="180" width="120" height="30" rx="5" fill="#E8F8F5" stroke="#16A085" stroke-width="1" />
  <text x="615" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#16A085">4. Report Generation</text>
  
  <!-- Progress Bar -->
  <rect x="425" y="220" width="250" height="20" rx="10" fill="#E8F8F5" stroke="#16A085" stroke-width="1" />
  <rect x="425" y="220" width="175" height="20" rx="10" fill="#16A085" />
  <text x="550" y="234" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Assessment Progress</text>
  
  <!-- Output Phase -->
  <rect x="750" y="90" width="100" height="180" rx="5" fill="#9B59B6" filter="url(#shadow)" />
  <text x="800" y="115" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Output</text>
  
  <rect x="765" y="130" width="70" height="130" rx="5" fill="#ffffff" stroke="#8E44AD" stroke-width="2" />
  <text x="800" y="150" font-family="Arial" font-size="11" text-anchor="middle" fill="#8E44AD">Scorecard</text>
  <line x1="765" y1="155" x2="835" y2="155" stroke="#8E44AD" stroke-width="1" />
  <text x="800" y="175" font-family="Arial" font-size="11" text-anchor="middle" fill="#8E44AD">Evidence</text>
  <line x1="765" y1="180" x2="835" y2="180" stroke="#8E44AD" stroke-width="1" />
  <text x="800" y="200" font-family="Arial" font-size="11" text-anchor="middle" fill="#8E44AD">Visualizations</text>
  <line x1="765" y1="205" x2="835" y2="205" stroke="#8E44AD" stroke-width="1" />
  <text x="800" y="225" font-family="Arial" font-size="11" text-anchor="middle" fill="#8E44AD">Details</text>
  <line x1="765" y1="230" x2="835" y2="230" stroke="#8E44AD" stroke-width="1" />
  <text x="800" y="250" font-family="Arial" font-size="11" text-anchor="middle" fill="#8E44AD">Download</text>
  
  <!-- Arrows -->
  <line x1="130" y1="120" x2="190" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="350" y1="170" x2="390" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="700" y1="170" x2="740" y2="170" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Detailed Multi-Agent Architecture -->
  <rect x="50" y="320" width="800" height="250" rx="5" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="345" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#2874A6">Under the Hood: Multi-Agent Architecture</text>
  
  <!-- Document Processing Box -->
  <rect x="70" y="360" width="190" height="190" rx="5" fill="#FFFFFF" stroke="#3498DB" stroke-width="2" />
  <text x="165" y="380" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2874A6">Document Processing</text>
  
  <rect x="85" y="395" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="165" y="415" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Text Analysis</text>
  
  <rect x="85" y="435" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="165" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Intelligent Chunking</text>
  
  <rect x="85" y="475" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="165" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Context Building</text>
  
  <!-- Framework Assessment Box -->
  <rect x="280" y="360" width="190" height="190" rx="5" fill="#FFFFFF" stroke="#3498DB" stroke-width="2" />
  <text x="375" y="380" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2874A6">Framework Assessment</text>
  
  <rect x="295" y="395" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="375" y="415" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Meta Planning</text>
  
  <rect x="295" y="435" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="375" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Parallel Extraction</text>
  
  <rect x="295" y="475" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="375" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Evidence Management</text>
  
  <rect x="295" y="515" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="375" y="535" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Confidence Tracking</text>
  
  <!-- Evidence & Results Box -->
  <rect x="490" y="360" width="190" height="190" rx="5" fill="#FFFFFF" stroke="#3498DB" stroke-width="2" />
  <text x="585" y="380" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2874A6">Evaluation Engine</text>
  
  <rect x="505" y="395" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="585" y="415" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Evidence Qualification</text>
  
  <rect x="505" y="435" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="585" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Direct vs. Inferred</text>
  
  <rect x="505" y="475" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="585" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Dimension Analysis</text>
  
  <rect x="505" y="515" width="160" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="585" y="535" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Cross-Criterion Insights</text>
  
  <!-- Report Generation Box -->
  <rect x="700" y="360" width="130" height="190" rx="5" fill="#FFFFFF" stroke="#3498DB" stroke-width="2" />
  <text x="765" y="380" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2874A6">Presentation</text>
  
  <rect x="715" y="395" width="100" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="765" y="415" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Scorecard</text>
  
  <rect x="715" y="435" width="100" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="765" y="455" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Visualization</text>
  
  <rect x="715" y="475" width="100" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="765" y="495" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Recommendations</text>
  
  <rect x="715" y="515" width="100" height="30" rx="5" fill="#D6EAF8" stroke="#3498DB" stroke-width="1" />
  <text x="765" y="535" font-family="Arial" font-size="12" text-anchor="middle" fill="#2874A6">Evidence Report</text>
  
  <!-- Connecting Arrows -->
  <line x1="260" y1="455" x2="280" y2="455" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="470" y1="455" x2="490" y2="455" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="680" y1="455" x2="700" y2="455" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Data Flow label -->
  <path d="M 250 415 C 280 415, 280 425, 280 455" stroke="#1ABC9C" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)" fill="none" />
  <path d="M 460 415 C 490 415, 490 425, 490 455" stroke="#1ABC9C" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)" fill="none" />
  <path d="M 670 415 C 700 415, 700 425, 700 455" stroke="#1ABC9C" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrow)" fill="none" />
  
  <rect x="440" y="370" width="100" height="20" rx="10" fill="#FFFFFF" stroke="#1ABC9C" stroke-width="1" />
  <text x="490" y="385" font-family="Arial" font-size="10" text-anchor="middle" fill="#1ABC9C">Evidence Flow</text>
  
  <!-- Footer -->
  <text x="450" y="580" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Learning Lab AI - Framework Assessment Workbench</text>
</svg>